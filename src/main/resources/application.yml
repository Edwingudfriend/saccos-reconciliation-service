server:
  port: 8080

spring:
  application:
    name: saccos-reconciliation-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reconciliation}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

fineract:
  base-url: ${FINERACT_BASE_URL:https://localhost:8443/fineract-provider/api/v1}
  username: ${FINERACT_USERNAME:mifos}
  password: ${FINERACT_PASSWORD:password}
  tenant-id: ${FINERACT_TENANT_ID:default}

services:
  mobile-money-service:
    base-url: ${MOBILE_MONEY_SERVICE_URL:http://localhost:8084}
  member-service:
    base-url: ${MEMBER_SERVICE_URL:http://localhost:8081}

reconciliation:
  amount-tolerance: ${RECON_AMOUNT_TOLERANCE:1.00}
  active-saccos: ${ACTIVE_SACCOS:DEFAULT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
